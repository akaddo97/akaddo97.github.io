[pytest]
testpaths = tests
# tests/ is on the path so conftest's helpers can be imported by name.
pythonpath = tests
# The worker tests are excluded by default: a push must not fail because a
# third party is having a bad afternoon. Run them with -m contract.
addopts = -q -m "not contract"
markers =
    contract: talks to the live worker; not run on a push
